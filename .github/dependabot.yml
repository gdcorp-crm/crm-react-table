version: 2
updates:
  # npm — the single root lockfile covers the workspaces (packages/* and examples/*).
  # old-examples/ (per-directory lockfiles) was removed, so scanning is scoped to "/".
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
